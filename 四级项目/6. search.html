<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>搜索漫画</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- 姓名：王欢欢 学号：24002120413 -->
</head>
<body>
    <header class="wang_header">
        <div class="wang_header_box">
            <div id="wang_back_search" class="wang_back_icon">←</div>
            
            <h1 class="wang_header_title">搜索</h1>
        </div>
    </header>
    <section class="wang_search_wrap">
        <!-- 搜索输入框区域 -->
        <div class="wang_search_input_box">
            <input id="wang_search_input" type="text" placeholder="输入漫画名称">
            <button id="wang_search_submit">搜索</button>
        </div>

        <!-- 历史记录区域 -->
        <div class="wang_history_block">
            <div class="block_title_row">
                <h3>历史记录</h3>
                <div class="title_right">
                    <span>展开 ∨</span>
                    <span class="del_icon">🗑</span>
                </div>
            </div>
            <div class="two_col_list">
                <div class="history_item">蛇夫与糖郎</div>
                <div class="history_item">逆袭之爱上情敌</div>
                <div class="history_item">反着爱</div>
                <div class="history_item">爱上前女友的现男友</div>
                <div class="history_item">腾讯动漫个人中心在哪</div>
                <div class="history_item">腾讯动漫个人资料</div>
            </div>
        </div>

        <!-- 猜你想搜 -->
        <div class="wang_recommend_block">
            <div class="block_title_row">
                <h3>猜你想搜</h3>
                <div class="title_right">
                    <span>换一换 ↻</span>
                </div>
            </div>
            <div class="two_col_list">
                <div class="recom_item">不二法门</div>
                <div class="recom_item">娱乐圈上位者</div>
                <div class="recom_item">爱我不要丢下我</div>
                <div class="recom_item">欲壑难填</div>
                <div class="recom_item">在劫难逃</div>
                <div class="recom_item">土炕暖娇郎</div>
            </div>
        </div>

        <!-- 猜你想看Tab栏 -->
        <div class="wang_tab_block">
            <div class="tab_scroll">
                <span class="tab_item active">猜你想看</span>
                <span class="tab_item">漫画热榜</span>
                <span class="tab_item">人气榜</span>
                <span class="tab_item">畅销榜</span>
                <span class="tab_item">出版榜</span>
            </div>
        </div>

        <!-- 漫画卡片区域 2列卡片 -->
        <div class="comic_card_list">
    <div class="comic_card">
        <img class="card_img" src="./11.囚于永夜.jpg" alt="漫画封面">
        <p class="card_text">你……</p>
        <div class="card_bottom">
            <span>一只铲屎官</span>
            <span>❤️ 952</span>
        </div>
    </div>
    <div class="comic_card">
        <img class="card_img" src="./4.lp生日.jpg" alt="漫画封面">
        <p class="card_text">近期三个商务战报</p>
        <div class="card_bottom">
            <span>先生有娱</span>
            <span>❤️ 47</span>
        </div>
    </div>
    <div class="comic_card">
        <img class="card_img" src="./1.lp翅膀.jpg" alt="漫画封面">
        <p class="card_text">漫画标题</p>
        <div class="card_bottom">
            <span>作者名称</span>
            <span>❤️ 233</span>
        </div>
    </div>
    <div class="comic_card">
        <img class="card_img" src="./5.暗河长明.jpg" alt="漫画封面">
        <p class="card_text">漫画标题</p>
        <div class="card_bottom">
            <span>作者名称</span>
            <span>❤️ 114</span>
        </div>
    </div>
</div>
    </section>
    <script src="./js/script.js"></script>
</body>
</html>
