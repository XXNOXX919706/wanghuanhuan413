<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>腾讯动漫-分类</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/iconfont.css">
    <!-- 姓名：王欢欢 学号：24002120413 -->
</head>
<body>
    <!-- 顶部导航 -->
    <header class="wang_header">
        <div class="wang_header_box">
            <h1 class="wang_header_title">漫画分类</h1>
           
        </div>
    </header>

    <!-- 题材分类区域 -->
    <section class="wang_category_wrap">
        <div class="wang_section_title">题材分类</div>
        <div id="wang_category_list" class="wang_category_grid">
            <!-- JS fetch 动态渲染分类标签 -->
        </div>
    </section>

    <!-- 热门题材漫画 -->
    <section class="wang_hot_category_comic">
        <div class="wang_section_title">热门题材漫画</div>
        <div class="wang_comic_list">
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./12.lp雪地.jpg" alt="溺爱">
                </div>
                <p class="wang_comic_card_name">溺爱</p>
                <p class="wang_comic_card_tag">玄幻 / 异人</p>
            </div>
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./11.囚于永夜.jpg" alt="囚于永夜">
                </div>
                <p class="wang_comic_card_name">囚于永夜</p>
                <p class="wang_comic_card_tag">恋爱 / 日常</p>
            </div>
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./4.lp生日.jpg" alt="栩愿一只渝">
                </div>
                <p class="wang_comic_card_name">栩愿一只渝</p>
                <p class="wang_comic_card_tag">玄幻 / 冒险</p>
            </div>
        </div>
    </section>

    <!-- ✅ 新增：男生爱看 -->
    <section class="wang_boy_comic">
        <div class="wang_section_title">男生爱看</div>
        <div class="wang_comic_list">

                    <img src="./10.一屋暗灯.jpg" alt="一屋暗灯">
                </div>
                <p class="wang_comic_card_name">一屋暗灯</p>
                <p class="wang_comic_card_tag">科幻 / 末日</p>
            </div>
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./2.欲言难止.jpg" alt="欲言难止">
                </div>
                <p class="wang_comic_card_name">欲言难止</p>
                <p class="wang_comic_card_tag">热血 / 神话</p>
            </div>
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./7.lp拦腰抱.jpg" alt="恶霸罩着你">
                </div>
                <p class="wang_comic_card_name">恶霸罩着你</p>
                <p class="wang_comic_card_tag">热血 / 战斗</p>
            </div>
        </div>
    </section>

    <!-- ✅ 新增：女生爱看 -->
    <section class="wang_girl_comic">
        <div class="wang_section_title">女生爱看</div>
        <div class="wang_comic_list">
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./6.雷子蓝单.jpg" alt="蛇佬">
                </div>
                <p class="wang_comic_card_name">蛇佬</p>
                <p class="wang_comic_card_tag">灵幻 / 少年</p>
            </div>
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./8.lp扛肩抱.jpg" alt="糖郎别跑">
                </div>
                <p class="wang_comic_card_name">糖郎别跑</p>
                <p class="wang_comic_card_tag">都市 / 妖怪</p>
            </div>
            <div class="wang_comic_card">
                <div class="wang_comic_card_img">
                    <img src="./9.lp红床双人.jpg" alt="你只属于我的另一只眼">
                </div>
                <p class="wang_comic_card_name">你只属于我的另一只眼</p>
                <p class="wang_comic_card_tag">恋爱 / 奇幻</p>
            </div>
        </div>
    </section>

    <!-- 漫画更新提示模块 -->
    <section class="wang_tips_wrap">
        <div class="wang_section_title">更新提示</div>
        <div class="wang_tips_box">
            <p>💡 点击上方题材，快速筛选对应类型漫画</p>
            <p>热门漫画每日更新，收藏后第一时间接收更新提醒</p>
        </div>
    </section>

    <!-- 底部Tab导航 -->
    <nav class="wang_tabbar">
        <a href="./index.html" class="wang_tab_item">

        <a href="./3.rank.html" class="wang_tab_item">

        <a href="./4.comic_detail.html" class="wang_tab_item">
            <i class="iconfont icon-wode wang_tab_icon"></i>
            <span class="wang_tab_text">我的</span>
