<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>腾讯动漫-我的</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- 姓名：王欢欢 学号：24002120413 -->
</head>
<body>

    <!-- 顶部用户信息区域 -->
    <section class="mine_user_box">
        <div class="mine_avatar_wrap">
            <img class="mine_avatar" src="./images/avatar.jpg" alt="用户头像">
        </div>
        <div class="mine_user_info">
            <div class="mine_username">Happppppy嘞</div>
            <div class="mine_user_level">Lv50异界主宰 <span class="mine_tag">铁粉成就</span></div>
            <div class="mine_honor">🏆 荣誉</div>
        </div>
        <div class="mine_sign_btn">签到</div>
    </section>

    <!-- 回归限免卡横幅 -->
    <div class="mine_banner">
        <span class="banner_text">回归限免卡</span>
        <span class="banner_time">剩余7天0小时</span>
        <img class="banner_img" src="./images/card.png" alt="限免卡">
    </div>

    <!-- 点券、阅点、阅读券、账户模块 -->
    <div class="mine_count_wrap">
        <div class="count_item">
            <div class="count_num">0</div>
            <div class="count_name">点券 <span class="count_tip">去充值</span></div>
        </div>
        <div class="count_item">
            <div class="count_num">5</div>
            <div class="count_name">阅点</div>
        </div>
        <div class="count_item">
            <div class="count_num">0</div>
            <div class="count_name">阅读券</div>
        </div>
        <div class="count_item">
            <div class="count_icon">👛</div>
            <div class="count_name">我的账户</div>
        </div>
    </div>

    <!-- V会员彩蛋礼包横幅 -->
    <div class="mine_vip_banner">
        <span>V会员 彩蛋礼包·限时加码</span>
        <button class="vip_btn">开彩蛋GO!</button>
    </div>

    <!-- ✅ 第5点：只保留福利中心，居中 -->
    <div class="mine_welfare_center">
        <div class="mine_card_block mine_card_block_center">
            <div class="block_title">福利中心 <span class="more">领福利 ></span></div>
            <div class="block_content">
                <div class="block_item">
                    <div class="item_name">阅读领奖</div>
                    <div class="item_go">Go></div>
                </div>
                <div class="block_item">
                    <div class="item_name">挑战领奖</div>
                    <div class="item_go">Go></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ 第6、7点：只保留周边商城 + 现金好礼 -->
    <div class="mine_func_wrap">
        <div class="func_item">
            <div class="func_icon">🎁</div>
            <div class="func_name">周边商城</div>
            <div class="func_desc">手办盲盒</div>
        </div>
        <div class="func_item">
            <div class="func_icon">🎁</div>
            <div class="func_name">现金好礼</div>
            <div class="func_desc">王者荣耀领福利</div>
        </div>
    </div>

    <!-- 夜间/日间、性别设置开关 -->
    <div class="mine_switch_wrap">
        <div class="switch_item">
            <span>夜间/日间</span>
            <span class="switch_tip">点击切换夜间模式</span>
            <div class="switch_btn"></div>
        </div>
        <div class="switch_item">
            <span>选择性别</span>
            <span class="switch_tip">不同性别内容不一样</span>
            <div class="switch_btn"></div>
        </div>
        <!-- 个人中心 点击跳转至4.mine.html -->
        <a href="./4.mine.html" class="switch_item">
            <span>个人中心</span>
            <span class="switch_tip">私人中心查看</span>
            <div class="switch_btn"></div>
        </a>
    </div>

    <!-- 底部Tab导航 -->
    <nav class="wang_tabbar">
        <a href="./index.html" class="wang_tab_item">
            <span class="wang_tab_icon">🏠</span>
            <span class="wang_tab_text">首页</span>
        </a>
        <a href="./2.category.html" class="wang_tab_item">
            <span class="wang_tab_icon">📂</span>
            <span class="wang_tab_text">分类</span>
        </a>
        <a href="./3.rank.html" class="wang_tab_item">
            <span class="wang_tab_icon">🔥</span>
            <span class="wang_tab_text">排行</span>
        </a>
        <a href="./4. comic_detail.html" class="wang_tab_item wang_tab_active">
            <span class="wang_tab_icon">👤</span>
            <span class="wang_tab_text">我的</span>
        </a>
    </nav>

    <script src="./js/script.js"></script>
</body>
</html>
