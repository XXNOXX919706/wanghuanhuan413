<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="https://at.alicdn.com/t/c/font_5231919_cyly67b2yq8.js"></script>
    <link rel="stylesheet" href="./css/svg.css">


</head>

<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changetab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-dianhua-copy"></use>
            </svg>
            <span>电话</span>
            <div class="budge-dot" id="budge-telephone"></div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-shoucang"></use>
            </svg>
            <span>收藏</span>
            <div class="budge-num" id="budge-favorite">100+</div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-xihuan"></use>
            </svg>
            <span>喜欢</span>
            <div class="budge-border" id="budge-like">100+</div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-sousuo"></use>
            </svg>
            <span>搜索</span>
            <div class="budge-num max" id="budge-search">100+</div>
        </div>
    </div>
    <script>
        //写一个函数，当我点击当天的item时候，颜色发生变化
        function changetab(current) {
            let tabs = document.querySelectorAll(".tab-item");
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
            }
            current.classList.add("active");
        }
    </script>
</body>

</html>
