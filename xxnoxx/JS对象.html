<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!-- 类 实例就是对象，两个要素 属性和方法
     学生的属性：学号，姓名，性别，年龄，班级
     方法：学习，睡觉，看电影，玩游戏-->
</head>
<body>
    <script>
        //创建对象
        var student={
            sno:2023001,
            name:"张三",
            sex:"男",
            age:18,
            class:"1-1",
            hobby:['看电影','游戏','看书'],
            study:function(){
                console.log("学习")
            },
            sleep:function(){
                console.log("睡觉")
            },
            watchMovie:function(){
                console.log("看电影")
            },
            playGame:function(){
                console.log("玩游戏")
            }
        }
        console.log(student.name);
        console.log(student.study());
        //删除对象方法
        delete student.WatchMovie;
        //判断对象中是否有某个属性或者方法
        console.log('WATCHMOVIE' in student);
        //对象的遍历
        for(var key in student){
            console.log(key,student[key]);
        }
        //对象赋值实质是复制了引用地址，相当于起别名，多个变量可以指向同一个对象
        var o=student;
        console.log(o.name);
        o.name="王五";
        //对象的引用类型（引用的是地址）
        console.log('o的名字'+o.name);
        console.log('student的名字'+student.name);
    </script>
</body>
</html>
