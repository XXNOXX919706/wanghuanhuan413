<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>漫画详情阅读页</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- 姓名：王欢欢 学号：24002120413 -->
</head>
<body>
    <!-- 顶部大图封面区域 -->
    <div class="read_banner_box">
        <button id="wang_back_read" class="read_back_btn" type="button" aria-label="返回上一页">←</button>
        <img class="read_banner_img" src="./9.lp红床双人.jpg" alt="漫画封面大图">
        <div class="read_title_box">
            <h2 class="read_comic_title">没有你是漫长的雨季</h2>
            <button class="read_follow_btn">+关注</button>
        </div>
        <div class="read_data_info">
            <span>520亿人气值 | 919万总评论 | 706万人关注</span>
        </div>
    </div>

    <!-- 会员折扣栏 -->
    <div class="read_vip_bar">
        <span class="vip_tag">会员85折</span>
        <span class="vip_text">会员享解锁漫画8.5折</span>
        <span class="vip_link">开会员 ></span>
    </div>

    <!-- 标签与简介区域 -->
    <div class="read_intro_wrap">
        <div class="read_tag_group">
            <span class="read_tag">KK独家</span>
            <span class="read_tag">恋爱</span>
            <span class="read_tag">职场</span>
        </div>
        <p class="read_desc">关于我在无锡遇到了我的爱人...<span class="expand_btn">展开∨</span></p>
        <div class="read_author_line">
            <span class="author_avatar"></span>
            <span class="author_name">田雷</span>
            <span class="author_avatar"></span>
            <span class="author_name">郑朋</span>
            <span class="author_avatar"></span>
            <span class="author_name">甜玉米</span>
            <span class="author_avatar"></span>
            <span class="author_name">米总</span>
        </div>
    </div>

    <!-- 评分模块 -->
    <div class="read_score_box">
        <div class="score_left">
            <span class="score_num">9.9</span>
            <span class="score_text">评分</span>
        </div>
        <div class="score_right">
            <span>919人打分 ></span>
        </div>
    </div>

    <!-- 等免阅读提示栏 -->
    <div class="read_free_tip">
        <div class="free_left">
            <span class="free_tag green">等免</span>
            <span class="free_price">¥0</span>
        </div>
        <div class="free_mid">
            <p>可免费阅读706话/共1314话</p>
            <p class="free_sub">付费章节更1话，可等免章节加1话</p>
        </div>
        <div class="free_right">可免费读</div>
    </div>

    <!-- 选集区域 -->
    <div class="read_select_wrap">
        <div class="select_head">
            <h3>选集</h3>
            <div class="select_head_right">
                <span>会员8.5折</span>
                <button class="buy_all_btn">一键购买</button>
            </div>
        </div>
        <p class="select_tip">已完结 | 共1314个内容 | 520篇番外</p>
        <div class="chapter_list">
            <div class="chapter_item">
                <img src="./7.lp拦腰抱.jpg" alt="第30话">
                <p>第30话 我心疼你</p>
            </div>
            <div class="chapter_item">
                <img src="./8.lp扛肩抱.jpg" alt="第31话">
                <p>第31话 大宝</p>
            </div>
        </div>
    </div>

    <!-- 底部继续阅读按钮 -->
    <div class="read_bottom_btn_box">
        <span class="current_chapter">第30话 大宝</span>
        <button class="continue_read_btn">继续阅读</button>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
