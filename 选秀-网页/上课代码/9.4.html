<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex布局复习</title>
    <style>
        /* 全局css */
        * {
            margin: 0;
            padding: 0;
            /* width和height包含内边距和边框 */
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        ul {
            list-style: none;
        }

        .page-header {
            /* linear-gradient的属性：方向、颜色1、颜色2、颜色3... */
            background: linear-gradient(135deg, #ff6347, green, #ff8c00);
            color: #fff;
            padding: 20px 40px;
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h2 {
            font-size: 36px;
        }
        .page-main{
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-main .case{
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }
        .case-title{
            font-size: 20px;
            padding:0 12px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }
        /*  案例一样式 */
        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            color: #fff;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
        }
        .logo{
            font-size: 30px;
            font-weight: bold;
            color: red;
            margin-left: 20px;
        }
        .nav-list{
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* 弹性布局和网格布局中设置间隔 */
            gap: 20px;
        }
        .nav-list a{
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .nav-list a:hover{
            background:rgba(255,255,255, 0.5);
        }

        .three-columns{
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background: yellow;
            padding: 20px;
            border-radius: 5px;
        }
        .three-columns .column{
            background: #aaa;
            padding: 20px;
            /* flex: 1是剩余空间平均分配 */
            flex: 1;
        }
        .three-columns .column:nth-child(2){
            background: blue;
        }
        .three-columns .column:nth-child(3){
            background: red;
        }

        .card-grid{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card-grid .card{
            background: #aaa;
            padding: 20px;
            /* flex的属性flex‑grow: 1是等比例放大，flex‑shrink: 1是等比例缩小，flex‑basis: 200px是基础宽度 */
            flex: 1 1 250px;
            text-align: center;
            transition: all 0.5s ease‑in‑out;
        }
        .card-grid .card:hover{
            /* sale(1.1)是放大1.1倍 */
            transform: scale(1.1) translateY(-10px);
            /* box‑shadow四个参数分别是x偏移量，y偏移量，模糊半径，阴影颜色 */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .sidebar{
            display: flex;
            flex-wrap: nowrap;
            gap: 20px;
            margin-top: 20px;
            background-color: #fafafa;
            padding: 20px;
            text-align: center;
            height: 200px;
        }
        .sidebar aside{
            flex:0 0 200px;
            border-radius: 5px;
            background-color: green;
            color: white;
        }
        .sidebar div{
            flex:1;
            border-radius: 5px;
            background-color: #aaa;
            color: white;
        }
    </style>
</head>
<body>
    <header class="page-header">
        <h2>Flex布局复习</h2>
    </header>
    <main class="page-main">
        <section class="case">
            <h2 class="case-title">案例一、导航布局</h2>
            <nav class="nav-bar">
                <a href="#" class="logo">MyWebsite</a>
                <!-- 快捷输入：ul>li*4（ul下面有4个li） -->
                <ul class="nav-list">
                    <li><a href="#">首页</a></li>
                    <li><a href="#">关于</a></li>
                    <li><a href="#">服务</a></li>
                    <li><a href="#">联系</a></li>
                </ul>
            </nav>
        </section>
        <!-- 案例二、三等分布局 -->
        <section class="case">
            <h2 class="case-title">案例二、三等分布局</h2>
            <div class="three-columns">
                <div class="column">第一列</div>
                <div class="column">第二列</div>
                <div class="column">第三列</div>
            </div>
        </section>

        <!-- 案例三卡片网格 -->
        <section class="case">
            <h2 class="case-title">案例三、卡片网格布局</h2>
            <div class="card-grid">
                <div class="card">卡片1</div>
                <div class="card">卡片2</div>
                <div class="card">卡片3</div>
                <div class="card">卡片4</div>
            </div>
        </section>

        <!-- 案例四侧边栏布局 -->
        <section class="case">
            <h2 class="case-title">案例四、侧边栏布局</h2>
            <div class="sidebar">
                <aside>侧边栏</aside>
                <div>主内容</div>
            </div>
        </section>
    </main>
</body>
</html>
